# 共用熱點：只在 dev 的核心任務修改。發佈前與手動時跑：交付 repo 推 candidate 分支時自動跑
# 一次（發佈快照，SOP 6.9），其他時候手動觸發；不設推任意分支就跑
name: CI
on:
  workflow_dispatch:
  push:
    branches: [candidate]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  jvm:                      # core＋desktop，在目標系統 Windows 上跑
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # 以完整 SHA 固定（資安總檢 L-6；2026-11-04 以 gh api 查標籤對應的 commit），註解是對應的標籤
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: token 檢查（先跑自我測試確認每條規則會擋）
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-tokens.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/check-tokens.ps1
          exit $LASTEXITCODE
      - run: ./gradlew :core:compileJava :core:animalsnifferMain :desktop:compileJava :core:test :desktop:test --no-daemon
      - name: core 涵蓋率門檻（AC-15-4，T-20；用上一步的測試結果）
        run: ./gradlew :core:jacocoTestCoverageVerification --no-daemon
      - run: ./gradlew :desktop:jpackageImage --no-daemon
      - name: 打包後自我檢查
        shell: pwsh
        run: |
          $env:SVAULT_DATA_DIR = "$env:RUNNER_TEMP\selfcheck"
          $p = Start-Process .\desktop\build\jpackage\S-Vault\S-Vault.exe -ArgumentList '--self-check' -Wait -PassThru
          Get-Content "$env:SVAULT_DATA_DIR\selfcheck.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Output "ExitCode=$($p.ExitCode)"; exit 1 }
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: ./gradlew :android:compileDebugJavaWithJavac :android:lintDebug :android:testDebugUnitTest :android:assembleDebug --no-daemon
