# 共用熱點：只在 dev 的核心任務修改（CONVENTIONS §9）
# 版本查證：2026-10-17（Maven Central、Google Maven、Gradle Plugin Portal）
[versions]
agp = "9.4.1"
javafx = "27"
keepassjava2 = "2.2.6"
staxApi12 = "1.2"
zxcvbn = "1.9.0"
jna = "5.19.1"
junit = "6.1.3"
junit4 = "4.13.2"
archunit = "1.5.1"
# 覆蓋率（T-20，AC-15-4；2026-10-21 查證 Maven Central 最新版 0.8.15）：Gradle 內建的 jacoco 外掛只換工具版本，
# CI 的 jvm job 用 Temurin 25，要 0.8.14 以上才認得 Java 25 的類別檔
jacoco = "0.8.15"
desugarJdkLibs = "2.1.5"
animalsniffer = "2.0.1"
gummyBears = "0.16.0"
appcompat = "1.8.0"
material = "1.14.0"
# 生物辨識（T-22，2026-10-21 查證 Google Maven：1.1.0 是最新穩定版，之後只有 1.2.0／1.4.0 的 alpha）
biometric = "1.1.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
keepassjava2-jackson = { module = "org.linguafranca.pwdb:KeePassJava2-jackson", version.ref = "keepassjava2" }
geronimo-stax-api = { module = "org.apache.geronimo.specs:geronimo-stax-api_1.2_spec", version.ref = "staxApi12" }
# 密碼強度評估（T-09，2026-10-18 查證 Maven Central 最新版）：只在 app.svault.core.security 使用
zxcvbn = { module = "com.nulab-inc:zxcvbn", version.ref = "zxcvbn" }
# Windows 鎖定偵測（T-18，2026-10-21 查證 Maven Central 最新穩定版 5.19.1；Apache 2.0／LGPL 2.1 雙授權，選 Apache 2.0）：
# 只在 desktop 的 app.svault.desktop.platform 使用；會一併帶入 net.java.dev.jna:jna
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

android-api29-signature = { module = "com.toasttab.android:gummy-bears-api-29", version.ref = "gummyBears" }
desugar-jdk-libs ={ module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# 只在 app.svault.android.feature.biometric 使用（BIO 的 BiometricPrompt；會一併帶入 USE_FINGERPRINT 權限，Architecture §3）
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
