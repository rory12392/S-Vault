# 匯入（IMP）的文字（UTF-8）。本檔屬模組分支 module/importer
module.name=從 Chrome 匯入
page.title=從 Chrome 匯入

step.choose=1 選擇檔案
step.preview=2 預覽
step.done=3 完成
step.current=第 {0} 步，共 {1} 步：{2}

choose.intro=選擇從 Chrome 或 Google 密碼管理工具匯出的密碼 CSV 檔。檔案只在這台電腦的記憶體中讀取，不會另存複本。
choose.how=在 Chrome 開啟「Google 密碼管理工具」→「設定」→「匯出密碼」，就能取得這個檔案。
choose.button=選擇 CSV 檔
choose.dialog.title=選擇 Chrome 匯出的密碼 CSV 檔
choose.dialog.filter=CSV 檔（*.csv）
choose.dialog.all=所有檔案

progress.reading=正在讀取 CSV 檔…
progress.importing=正在匯入 {0} 筆…

preview.total=共 {0} 筆
preview.first=前 {0} 筆
preview.col.name=名稱
preview.col.username=帳號
preview.col.url=網址
preview.col.password=密碼
preview.masked=密碼已隱藏
preview.duplicate=可能重複
preview.skipped=跳過 {0} 列：第 {1} 行（格式錯誤，這些列不會匯入）
preview.rechoose=重新選擇檔案
preview.import=匯入到「{0}」群組
preview.nothing=沒有要匯入的條目。可以改選「照樣匯入」，或重新選擇檔案。

duplicate.intro=有 {0} 筆的網址網域和帳號都和保管庫裡的條目相同，可能已經存在：第 {1} 行
duplicate.skip=略過可能重複的 {0} 筆
duplicate.keep=照樣匯入

done.title=已匯入 {0} 筆
done.group=已放進新的「{0}」群組。
done.warning=CSV 檔中的密碼沒有加密，任何人打開都看得到。建議現在刪除這個檔案。
done.path=檔案位置
done.again=匯入另一個檔案

problem.read-failed=無法讀取這個檔案。確認檔案還在、沒有被其他程式鎖住，再選一次。
problem.empty=這個檔案是空的。重新從 Chrome 匯出密碼後再選一次。
problem.missing-columns=這不是 Chrome 匯出的密碼 CSV 檔（找不到網址、帳號、密碼欄位）。選擇從 Google 密碼管理工具匯出的檔案。
problem.not-utf8=無法辨識這個檔案的文字編碼。直接選擇 Chrome 匯出的檔案，不要先用其他程式另存。
problem.too-large=檔案超過 16 MB 或 10 萬筆，不像是 Chrome 匯出的密碼檔。確認選對檔案。
problem.locked=保管庫已上鎖，沒有匯入任何條目。解鎖後再匯入一次。
problem.conflict=保管庫有衝突要先處理，沒有匯入任何條目。回到條目清單處理衝突後再匯入一次。
problem.save-failed=沒有匯入任何條目：無法儲存保管庫。確認連線與檔案權限後再試一次。
